[pytest]
testpaths = tests
# The repository root makes the v2 package (faultlab/) importable beside the legacy app.
pythonpath = . ..
# The default run is the core suite; research experiment tests run on demand (-m experiment).
addopts = -m "not experiment"
markers =
    localhost_http: permits only loopback sockets for real simulator HTTP integration
    experiment: research experiment tests under tests/experiments (excluded from the default run)
