name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two parallel jobs. The backend suite alone takes about 15 minutes on a recent laptop and may take
# longer on a hosted runner, so it has its own job and a larger limit. Node comes from .nvmrc
# (20.19.0, inside package.json engines: ^20.19.0 || >=22.12.0), the same version the docs use.
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FAULTLAB_LIVE_ENABLED: "false"
      FAULTLAB_ARIA_PUBLISH_ENABLED: "false"
      FAULTLAB_BROWSER_LOCAL: "0"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked local dependencies
        run: ./scripts/setup.sh
      - name: Run offline backend tests
        run: ./scripts/test.sh backend

  frontend:
    name: Frontend, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FAULTLAB_LIVE_ENABLED: "false"
      FAULTLAB_ARIA_PUBLISH_ENABLED: "false"
      FAULTLAB_BROWSER_LOCAL: "0"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked local dependencies
        run: ./scripts/setup.sh
      - name: Install browser for fixture checks
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run offline frontend, build and browser checks
        run: ./scripts/test.sh frontend build browser
