name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly: the research experiment tests

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two parallel jobs. The backend suite alone takes about 15 minutes on a recent laptop and may take
# longer on a hosted runner, so it has its own job and a larger limit. Node comes from .nvmrc
# (20.19.0, inside package.json engines: ^20.19.0 || >=22.12.0), the same version the docs use.
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FAULTLAB_LIVE_ENABLED: "false"
      FAULTLAB_ARIA_PUBLISH_ENABLED: "false"
      FAULTLAB_BROWSER_LOCAL: "0"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked local dependencies
        run: ./scripts/setup.sh
      - name: Run offline backend tests (core suite; experiment tests run in the experiments job)
        run: ./scripts/test.sh backend

  v2-offline-batch:
    name: v2 offline batch (reference adapter, legacy checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FAULTLAB_LIVE_ENABLED: "false"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: ./scripts/setup.sh --backend-only
      - name: Run every orders scenario twice with the reference adapter and the fixed checks (no provider)
        run: |
          mkdir -p artifacts/ci
          ./.venv/bin/python -m faultlab run --store artifacts/ci/trials.sqlite3 --pack orders.upgrade_then_confirm/v1 \
            --adapter reference-orders --referee legacy --k 2 --bundle artifacts/ci/batch.zip | tee artifacts/ci/summary.json
      - name: Fail on any violation, false claim, unfired fault or non-completed execution
        run: |
          ./.venv/bin/python - <<'EOF'
          import json
          summary = json.load(open("artifacts/ci/summary.json"))
          bad = [t for t in summary["trials"] if t["execution"] != "COMPLETED" or t["violations"] or t["claims"] or t["faults_triggered"] is not True]
          print(json.dumps({"trials": len(summary["trials"]), "tasks": summary["tasks"], "problems": bad}, indent=2))
          raise SystemExit(1 if bad or not summary["trials"] else 0)
          EOF

  frontend:
    name: Frontend, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FAULTLAB_LIVE_ENABLED: "false"
      FAULTLAB_ARIA_PUBLISH_ENABLED: "false"
      FAULTLAB_BROWSER_LOCAL: "0"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked local dependencies
        run: ./scripts/setup.sh
      - name: Install browser for fixture checks
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run offline frontend, build and browser checks
        run: ./scripts/test.sh frontend build browser

  experiments:
    name: Research experiment tests (weekly or on demand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FAULTLAB_LIVE_ENABLED: "false"
      FAULTLAB_ARIA_PUBLISH_ENABLED: "false"
      FAULTLAB_BROWSER_LOCAL: "0"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked local dependencies
        run: ./scripts/setup.sh
      - name: Run the research experiment tests
        run: ./scripts/test.sh experiments
