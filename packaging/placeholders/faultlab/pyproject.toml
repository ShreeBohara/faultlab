[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faultlab"
version = "0.0.1"
description = "Effect-level reliability lab for agents that act: faults at the service boundary, actual effects versus the agent's claims, portable regressions. Name reserved; the first real release follows the v2 rebuild."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Shree Bohara" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ShreeBohara/faultlab"

[tool.setuptools]
packages = ["faultlab"]
